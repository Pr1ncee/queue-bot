name: queue-bot

services:
  mongodb:
    image: mongo:8.0.0-rc11
    restart: always
    ports:
      - '27017:27017'
    env_file:
      - ../../.env
    volumes:
      - ../../mongo/data/:/data/db
    profiles: [mongodb]

  queue_bot:
    image: queue-bot:latest
    depends_on:
      - mongodb
    links:
      - "mongodb:db"
    env_file:
      - ../../.env
    volumes:
      - ../../:/app/
    restart: on-failure

  redis:
    image: redis:7.4-rc-bookworm
    restart: always
    env_file:
      - ../../.env
    ports:
      - '6379:6379'
    volumes:
      - ../../redis:/var/lib/redis/data
    profiles: [redis]

volumes:
  mongodb:
  redis:
